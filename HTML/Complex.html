<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Form</title>
</head>
<body>
    <h1>Complex Form</h1>
    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Enter your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name ..." required>
            <br><br>

            <label for="email">Enter your Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email ..." required>
            <br><br>

            <label for="phone">Enter your Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number ..." required>
            <br><br>

            <label for="dob">Enter your Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>

            <p>Select your Gender:</p>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>

            <label for="country">Select your Country:</label>
            <select id="country" name="country" required>
                <option value="">Select your country</option>
                <option value="usa">USA</option>
                <option value="india">India</option>
                <option value="uk">UK</option>
                <option value="australia">Australia</option>
            </select>
        </fieldset>
        <br><br>

        <fieldset>
            <legend>Address Information</legend>

            <label for="street">Street:</label>
            <input type="text" id="street" name="street" placeholder="Enter your street ..." required>
            <br><br>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="Enter your city ..." required>
            <br><br>

            <label for="state">State:</label>
            <input type="text" id="state" name="state" placeholder="Enter your state ..." required>
            <br><br>

            <label for="zip">Zip Code:</label>
            <input type="text" id="zip" name="zip" placeholder="Enter your zip code ..." required>
        </fieldset>
        <br><br>

        <fieldset>
            <legend>Other Information</legend>

            <label for="comment">Comment:</label><br>
            <textarea id="comment" name="comment" rows="4" cols="50" placeholder="Enter your comment here ..."></textarea>
            <br><br>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
        </fieldset>
        <br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
